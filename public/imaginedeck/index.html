<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛媛大学ミュージアム イマジン・デッキ</title>
    <script>
        // Declares the watchdog version this HTML expects. Only watchdog.js may
        // set __IMAGINEDECK_WATCHDOG_VERSION__ after successful initialization.
        window.__IMAGINEDECK_EXPECTED_WATCHDOG_VERSION__ = 2;
    </script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #imaginedeck-frame {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
        }
    </style>
</head>

<body>
    <iframe
        id="imaginedeck-frame"
        src="about:blank"
        title="愛媛大学ミュージアム イマジン・デッキ"
        allow="autoplay; fullscreen"
        loading="eager"
    ></iframe>
    <script>
        (() => {
            'use strict';

            const SERVICE_WORKER_URL = '/sw.js';
            const SERVICE_WORKER_SCOPE = '/';
            const APP_URL = new URL('./app.html', window.location.href).href;
            const SERVICE_WORKER_BOOTSTRAP_TIMEOUT_MS = 15_000;
            const ACTIVATION_TIMEOUT_MS = 10_000;
            const CONTROL_TIMEOUT_MS = 5_000;
            const RETRY_DELAY_MS = 30_000;
            const frame = document.getElementById('imaginedeck-frame');
            let appNavigationStarted = false;
            let bootstrapInProgress = false;
            let retryTimerId = null;

            function withTimeout(promise, timeoutMs, label) {
                return new Promise((resolve, reject) => {
                    const timeoutId = setTimeout(
                        () => reject(new Error(`${label} timed out after ${timeoutMs} ms`)),
                        timeoutMs
                    );

                    Promise.resolve(promise).then(
                        value => {
                            clearTimeout(timeoutId);
                            resolve(value);
                        },
                        error => {
                            clearTimeout(timeoutId);
                            reject(error);
                        }
                    );
                });
            }

            function waitForWorkerActivation(worker) {
                if (!worker || worker.state === 'activated') {
                    return Promise.resolve();
                }
                if (worker.state === 'redundant') {
                    return Promise.reject(
                        new Error('Service Worker became redundant before activation')
                    );
                }

                return withTimeout(
                    new Promise((resolve, reject) => {
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'activated') {
                                resolve();
                            } else if (worker.state === 'redundant') {
                                reject(
                                    new Error(
                                        'Service Worker became redundant before activation'
                                    )
                                );
                            }
                        });
                    }),
                    ACTIVATION_TIMEOUT_MS,
                    'Service Worker activation'
                );
            }

            function waitForController(expectedWorker) {
                const isExpectedController = () => {
                    const controller = navigator.serviceWorker.controller;
                    return Boolean(
                        controller &&
                        (!expectedWorker || controller === expectedWorker)
                    );
                };

                if (isExpectedController()) {
                    return Promise.resolve();
                }

                return new Promise((resolve, reject) => {
                    const onControllerChange = () => {
                        if (!isExpectedController()) {
                            return;
                        }
                        clearTimeout(timeoutId);
                        navigator.serviceWorker.removeEventListener(
                            'controllerchange',
                            onControllerChange
                        );
                        resolve();
                    };
                    const timeoutId = setTimeout(() => {
                        navigator.serviceWorker.removeEventListener(
                            'controllerchange',
                            onControllerChange
                        );
                        reject(
                            new Error(
                                `Service Worker controller acquisition timed out after ${CONTROL_TIMEOUT_MS} ms`
                            )
                        );
                    }, CONTROL_TIMEOUT_MS);

                    navigator.serviceWorker.addEventListener(
                        'controllerchange',
                        onControllerChange
                    );
                });
            }

            async function ensurePortalServiceWorker() {
                const registration = await withTimeout(
                    navigator.serviceWorker.register(
                        SERVICE_WORKER_URL,
                        {
                            scope: SERVICE_WORKER_SCOPE,
                            updateViaCache: 'none'
                        }
                    ),
                    SERVICE_WORKER_BOOTSTRAP_TIMEOUT_MS,
                    'Service Worker registration'
                );

                await withTimeout(
                    registration.update(),
                    SERVICE_WORKER_BOOTSTRAP_TIMEOUT_MS,
                    'Service Worker update'
                );

                const updateCandidate =
                    registration.installing || registration.waiting;
                let expectedController = registration.active;

                if (updateCandidate) {
                    await waitForWorkerActivation(updateCandidate);
                    expectedController = updateCandidate;
                }

                if (!expectedController) {
                    throw new Error(
                        'Service Worker update completed without an active worker'
                    );
                }

                // Do not accept an arbitrary pre-existing controller here. A
                // returning visitor may still be controlled by the previous
                // worker while the newly checked worker is activating.
                await waitForController(expectedController);
            }

            function loadWatchdog() {
                const script = document.createElement('script');
                script.src = './watchdog.js';
                script.async = false;
                script.addEventListener('error', () => {
                    console.error('[ImagineDeck Bootstrap] Failed to load watchdog.js.');
                });
                document.body.append(script);
            }

            function startAppNavigation(reason, requireController = true) {
                if (appNavigationStarted) {
                    return false;
                }
                if (
                    requireController &&
                    'serviceWorker' in navigator &&
                    !navigator.serviceWorker.controller
                ) {
                    return false;
                }

                appNavigationStarted = true;
                frame.src = APP_URL;
                console.info('[ImagineDeck Bootstrap] iframe navigation started.', {
                    reason,
                    controlled: Boolean(navigator.serviceWorker?.controller)
                });
                return true;
            }

            function notifyServiceWorkerReady(reason) {
                window.dispatchEvent(
                    new CustomEvent('imaginedeck-service-worker-ready', {
                        detail: { reason }
                    })
                );
            }

            function scheduleBootstrapRetry() {
                if (retryTimerId !== null) {
                    return;
                }
                retryTimerId = setTimeout(() => {
                    retryTimerId = null;
                    void startServiceWorkerBootstrap();
                }, RETRY_DELAY_MS);
            }

            async function startServiceWorkerBootstrap() {
                if (bootstrapInProgress || !('serviceWorker' in navigator)) {
                    return;
                }

                bootstrapInProgress = true;
                try {
                    await ensurePortalServiceWorker();
                    startAppNavigation(
                        'updated portal Service Worker is controlling the page'
                    );
                    notifyServiceWorkerReady('bootstrap completed');
                } catch (error) {
                    console.warn(
                        '[ImagineDeck Bootstrap] Service Worker registration or update failed; retaining the blank bootstrap frame and retrying.',
                        error
                    );
                    scheduleBootstrapRetry();
                } finally {
                    bootstrapInProgress = false;
                }
            }

            // Watchdog loading is bounded independently from Service Worker work.
            loadWatchdog();

            if (!('serviceWorker' in navigator)) {
                // A browser without Service Worker support cannot later claim a
                // partially loaded iframe, so direct navigation is safe.
                startAppNavigation('Service Worker is unsupported', false);
                return;
            }

            // Even when a controller already exists, keep the iframe blank until
            // registration.update() confirms which active worker must control it.
            void startServiceWorkerBootstrap();
        })();
    </script>
</body>

</html>
