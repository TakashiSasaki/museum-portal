<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <title>愛媛大学ミュージアム イマジン・デッキ</title>
    <script>
        // Declares the watchdog version this HTML expects. Only watchdog.js may
        // set __IMAGINEDECK_WATCHDOG_VERSION__ after successful initialization.
        window.__IMAGINEDECK_EXPECTED_WATCHDOG_VERSION__ = 2;
    </script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #imaginedeck-frame {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
        }
        #fullscreen-guard[hidden] {
            display: none !important;
        }
        #fullscreen-guard {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 4vmin;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        #fullscreen-guard-panel {
            width: min(88vw, 48rem);
            padding: clamp(1.5rem, 4vmin, 3rem);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 1.25rem;
            background: rgba(18, 18, 24, 0.92);
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.45);
        }
        #fullscreen-guard-title {
            display: block;
            margin: 0 0 0.75rem;
            font-size: clamp(1.5rem, 4vmin, 2.5rem);
            font-weight: 700;
            line-height: 1.3;
        }
        #fullscreen-guard-message {
            display: block;
            margin: 0;
            font-size: clamp(1rem, 2.5vmin, 1.5rem);
            line-height: 1.6;
        }
        #fullscreen-guard-countdown {
            display: block;
            margin-top: 1rem;
            font-size: clamp(3rem, 14vmin, 8rem);
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <iframe
        id="imaginedeck-frame"
        src="about:blank"
        title="愛媛大学ミュージアム イマジン・デッキ"
        allow="autoplay; fullscreen"
        loading="eager"
    ></iframe>
    <div
        id="fullscreen-guard"
        role="button"
        tabindex="0"
        aria-live="polite"
        aria-label="全画面表示に戻る"
        hidden
    >
        <div id="fullscreen-guard-panel">
            <span id="fullscreen-guard-title"></span>
            <span id="fullscreen-guard-message"></span>
            <span id="fullscreen-guard-countdown"></span>
        </div>
    </div>
    <script src="./fullscreen-guard.js"></script>
    <script src="./bootstrap-v45.js"></script>
</body>
</html>
