<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛媛大学ミュージアム イマジン・デッキ</title>
    <script>
        // Declares the watchdog version this HTML expects. Only watchdog.js may
        // set __IMAGINEDECK_WATCHDOG_VERSION__ after successful initialization.
        window.__IMAGINEDECK_EXPECTED_WATCHDOG_VERSION__ = 2;
    </script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #imaginedeck-frame {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
        }
    </style>
</head>

<body>
    <iframe
        id="imaginedeck-frame"
        src="./app.html"
        title="愛媛大学ミュージアム イマジン・デッキ"
        allow="autoplay; fullscreen"
        loading="eager"
    ></iframe>
    <script>
        (() => {
            'use strict';

            const SERVICE_WORKER_URL = '/sw.js';
            const SERVICE_WORKER_SCOPE = '/';
            const SERVICE_WORKER_BOOTSTRAP_TIMEOUT_MS = 15_000;
            const ACTIVATION_TIMEOUT_MS = 10_000;
            const CONTROL_TIMEOUT_MS = 5_000;

            function withTimeout(promise, timeoutMs, label) {
                return new Promise((resolve, reject) => {
                    const timeoutId = setTimeout(
                        () => reject(new Error(`${label} timed out after ${timeoutMs} ms`)),
                        timeoutMs
                    );

                    Promise.resolve(promise).then(
                        value => {
                            clearTimeout(timeoutId);
                            resolve(value);
                        },
                        error => {
                            clearTimeout(timeoutId);
                            reject(error);
                        }
                    );
                });
            }

            function waitForWorkerActivation(worker) {
                if (!worker || worker.state === 'activated' || worker.state === 'redundant') {
                    return Promise.resolve();
                }

                return withTimeout(
                    new Promise(resolve => {
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'activated' || worker.state === 'redundant') {
                                resolve();
                            }
                        });
                    }),
                    ACTIVATION_TIMEOUT_MS,
                    'Service Worker activation'
                );
            }

            function waitForController() {
                if (navigator.serviceWorker.controller) {
                    return Promise.resolve();
                }

                return withTimeout(
                    new Promise(resolve => {
                        navigator.serviceWorker.addEventListener(
                            'controllerchange',
                            resolve,
                            { once: true }
                        );
                    }),
                    CONTROL_TIMEOUT_MS,
                    'Service Worker controller acquisition'
                );
            }

            async function ensurePortalServiceWorker() {
                if (!('serviceWorker' in navigator)) {
                    return;
                }

                const registration = await navigator.serviceWorker.register(
                    SERVICE_WORKER_URL,
                    {
                        scope: SERVICE_WORKER_SCOPE,
                        updateViaCache: 'none'
                    }
                );

                await registration.update();
                await waitForWorkerActivation(
                    registration.installing || registration.waiting
                );
                await waitForController();
            }

            function loadWatchdog() {
                const script = document.createElement('script');
                script.src = './watchdog.js';
                script.async = false;
                script.addEventListener('error', () => {
                    console.error('[ImagineDeck Bootstrap] Failed to load watchdog.js.');
                });
                document.body.append(script);
            }

            // Watchdog availability must not depend on registration/update latency.
            loadWatchdog();

            void withTimeout(
                ensurePortalServiceWorker(),
                SERVICE_WORKER_BOOTSTRAP_TIMEOUT_MS,
                'Service Worker bootstrap'
            ).then(() => {
                window.dispatchEvent(new Event('imaginedeck-service-worker-ready'));
            }).catch(error => {
                console.warn(
                    '[ImagineDeck Bootstrap] Service Worker registration or update failed.',
                    error
                );
            });
        })();
    </script>
</body>

</html>
